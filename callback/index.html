<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logging in... - Spritedex</title>
<style>
body{margin:0;background:#0a0c12;color:#f0f2f8;font-family:system-ui;display:grid;place-items:center;min-height:100vh}
.box{text-align:center;padding:40px}
h1{font-size:24px;margin:0 0 12px}
p{color:#6b7280;margin:0}
.spinner{width:40px;height:40px;border:3px solid #252a38;border-top-color:#00d4ff;border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <h1>Logging in...</h1>
  <p>Please wait while we connect to Epic Games</p>
</div>
<script>
// This page handles the OAuth callback
// The worker redirects here with auth_success or error params
const params = new URLSearchParams(window.location.search);

if (params.get('auth_success')) {
  // Store auth info and redirect to main page
  localStorage.setItem('epic_account_id', params.get('account_id'));
  localStorage.setItem('epic_display_name', params.get('display_name'));
  localStorage.setItem('epic_logged_in', 'true');
  window.location.href = '/?synced=1';
} else if (params.get('code')) {
  // If we got a code directly, forward to the worker callback
  window.location.href = 'https://spritedex-api.abrasive-tax.workers.dev/auth/callback' + window.location.search;
} else if (params.get('error')) {
  document.body.innerHTML = '<div class="box"><h1>Login Failed</h1><p>' + params.get('error') + '</p><p style="margin-top:20px"><a href="/" style="color:#00d4ff">Back to Spritedex</a></p></div>';
} else {
  window.location.href = '/';
}
</script>
</body>
</html>
