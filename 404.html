<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Redirecting...</title>
<script>
// Handle GitHub Pages SPA routing
// Redirect /profile/username to /profile.html?u=username
const path = window.location.pathname;
const match = path.match(/^\/profile\/(.+)/);
if (match) {
  const username = match[1];
  window.location.replace('/profile.html?u=' + encodeURIComponent(username));
} else {
  // Not a profile route, redirect to home
  window.location.replace('/');
}
</script>
</head>
<body>
<p>Redirecting...</p>
</body>
</html>
