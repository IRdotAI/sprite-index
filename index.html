<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f16">
<title>Sprite Index</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0d0f16; --panel:#161a26; --panel2:#1e2333; --line:#2a3145;
  --text:#e8ecf6; --dim:#8b94ad; --accent:#4dd4ff;
  --rare:#3AA7F0; --epic:#A64BF4; --legendary:#F0862E; --mythic:#F5C542;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:20;background:rgba(13,15,22,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-top)) ;padding-top:calc(10px + env(safe-area-inset-top))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;flex:1}
button,select,input{font:inherit;color:var(--text);background:var(--panel2);
  border:1px solid var(--line);border-radius:9px;padding:8px 11px}
button{cursor:pointer}
button:active{transform:scale(.97)}
.btn-accent{background:var(--accent);color:#04202b;border-color:transparent;font-weight:650}
input[type=search]{flex:1;min-width:120px}

.stats{display:flex;gap:6px;margin-top:9px;overflow-x:auto;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:6px 10px;white-space:nowrap;font-size:12px}
.stat b{font-size:15px;display:block;line-height:1.25}
.stat span{color:var(--dim)}

.filters{display:flex;gap:6px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.chip{border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;
  background:var(--panel);border:1px solid var(--line);color:var(--dim)}
.chip.on{background:var(--accent);color:#04202b;border-color:transparent;font-weight:650}

main{padding:12px}
.group-title{display:flex;align-items:center;gap:8px;margin:18px 0 9px;font-size:13px;
  text-transform:uppercase;letter-spacing:.9px;color:var(--dim);font-weight:700}
.group-title::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}

.card{position:relative;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:8px 7px 7px;text-align:center;cursor:pointer;
  transition:border-color .12s,background .12s;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--r)}
.card.owned{background:var(--panel2);border-color:var(--r)}
.card:not(.owned) .art,.card:not(.owned) .nm,.card:not(.owned) .vr{opacity:.32;filter:grayscale(1)}
.art{width:46px;height:46px;margin:5px auto 6px;border-radius:10px;
  display:grid;place-items:center;font-size:20px;font-weight:800;color:#0c0e14;
  background:var(--r)}
img.art{object-fit:contain;background:transparent}
.nm{font-size:12px;font-weight:650;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vr{font-size:10.5px;color:var(--dim);margin-top:1px}
.star{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:7px;
  border:0;background:rgba(0,0,0,.35);color:#4a5268;font-size:13px;line-height:1;
  display:grid;place-items:center;padding:0}
.card.mastered .star{background:var(--mythic);color:#1a1400}
.card.mastered{border-color:var(--mythic)}
.empty{color:var(--dim);text-align:center;padding:40px 12px}

dialog{border:1px solid var(--line);background:var(--panel);color:var(--text);
  border-radius:14px;padding:0;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg-body{padding:16px}
.dlg-body h2{margin:0 0 4px;font-size:16px}
.dlg-body p{margin:0 0 14px;color:var(--dim);font-size:13px}
.dlg-body label{display:block;font-size:12px;color:var(--dim);margin:10px 0 5px}
.dlg-body select{width:100%}
.dlg-actions{display:flex;gap:8px;margin-top:16px}
.dlg-actions button{flex:1}
</style>
</head>
<body>

<header>
  <div class="row">
    <h1>Sprite Index</h1>
    <button id="exportBtn" class="btn-accent">Export</button>
    <button id="menuBtn" aria-label="Data menu">⋯</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="row" style="margin-top:9px">
    <input type="search" id="search" placeholder="Search sprites…" autocomplete="off">
  </div>
  <div class="filters" id="fStatus"></div>
  <div class="filters" id="fRarity"></div>
</header>

<main><div id="content"></div></main>

<dialog id="exportDlg"><div class="dlg-body">
  <h2>Export image</h2>
  <p>Saves a PNG of your index.</p>
  <label for="exView">Show</label>
  <select id="exView">
    <option value="all">All sprites — uncollected greyed out</option>
    <option value="owned">Collected only</option>
    <option value="missing">Missing only</option>
    <option value="mastered">Mastered only</option>
    <option value="unmastered">Collected but NOT mastered</option>
  </select>
  <label for="exGroup">Group by</label>
  <select id="exGroup">
    <option value="rarity">Rarity</option>
    <option value="sprite">Sprite</option>
    <option value="none">Nothing — one grid</option>
  </select>
  <div class="dlg-actions">
    <button id="exCancel">Cancel</button>
    <button id="exGo" class="btn-accent">Save PNG</button>
  </div>
</div></dialog>

<dialog id="menuDlg"><div class="dlg-body">
  <h2>Data</h2>
  <p>Your progress is stored on this device only.</p>
  <div class="dlg-actions" style="flex-direction:column">
    <button id="importBtn" class="btn-accent">Import from SpriteTrading</button>
    <button id="backupBtn">Back up progress (JSON)</button>
    <button id="restoreBtn">Restore from backup</button>
    <button id="resetBtn">Reset all progress</button>
    <button id="menuClose">Done</button>
  </div>
  <input type="file" id="restoreFile" accept="application/json" hidden>
  <input type="file" id="importFile" accept="application/json" hidden>
</div></dialog>

<script>
const KEY='spriteIndex.v1', CATKEY='spriteIndex.catalog.v1';
let DB=null, state=load(), catalog=loadCat(), filters={status:'all',rarity:'all',q:''};

function load(){ try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}} }
function save(){ localStorage.setItem(KEY,JSON.stringify(state)) }
function loadCat(){ try{return JSON.parse(localStorage.getItem(CATKEY))||null}catch{return null} }
const uid=(s,v)=>s+':'+v;
const st=k=>state[k]||{owned:false,mastered:false};

const norm=s=>(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const findSprite=name=>DB.sprites.find(s=>norm(s.name)===norm(name))
  || DB.sprites.find(s=>norm(s.id)===norm(name));
const findVariant=name=>DB.variants.find(v=>norm(v.name)===norm(name))
  || (norm(name)==='base' ? DB.variants.find(v=>v.id==='normal') : null);

// Entries come from an imported SpriteTrading catalog when we have one —
// that's authoritative for which variants actually exist per sprite.
// Otherwise fall back to the shipped (partly inferred) database.
let ENTRIES=[];
function buildEntries(){
  ENTRIES=[];
  if(catalog && catalog.entries && catalog.entries.length){
    for(const e of catalog.entries){
      const s=findSprite(e.sprite);
      const v=findVariant(e.variant);
      const vid=v?v.id:norm(e.variant);
      ENTRIES.push({
        key:uid(s?s.id:norm(e.sprite),vid),
        sprite:s||{id:norm(e.sprite),name:e.sprite,
          rarity:(e.rarity||'rare').toLowerCase(),ability:'',howToGet:''},
        variantId:vid,
        variant:v||{id:vid,name:e.variant,effect:''},
        img:e.img||null
      });
    }
    // Keep the shipped rarity where we have it; "Special" isn't a real tier.
    for(const e of ENTRIES)
      if(!DB.rarities.some(r=>r.id===e.sprite.rarity)) e.sprite.rarity='rare';
  } else {
    for(const s of DB.sprites)
      for(const v of s.variants)
        ENTRIES.push({key:uid(s.id,v),sprite:s,variantId:v,
          variant:DB.variants.find(x=>x.id===v),img:null});
  }
}

// Apply a spritetrading-export.json file.
function importExport(d){
  if(!d || !Array.isArray(d.entries)) throw new Error('not a SpriteTrading export');
  catalog={entries:d.entries};
  localStorage.setItem(CATKEY,JSON.stringify(catalog));
  buildEntries();
  const byKey=new Map(ENTRIES.map(e=>[e.key,e]));
  let n=0;
  for(const e of d.entries){
    const s=findSprite(e.sprite), v=findVariant(e.variant);
    const k=uid(s?s.id:norm(e.sprite), v?v.id:norm(e.variant));
    if(!byKey.has(k)) continue;
    state[k]={owned:!!e.collected, mastered:!!e.mastered, level:e.level||null};
    n++;
  }
  save(); render();
  return {applied:n, total:d.entries.length};
}

function visible(){
  const q=filters.q.trim().toLowerCase();
  return ENTRIES.filter(e=>{
    const s=st(e.key);
    if(filters.rarity!=='all' && e.sprite.rarity!==filters.rarity) return false;
    if(filters.status==='owned' && !s.owned) return false;
    if(filters.status==='missing' && s.owned) return false;
    if(filters.status==='mastered' && !s.mastered) return false;
    if(filters.status==='unmastered' && !(s.owned && !s.mastered)) return false;
    if(q && !(e.sprite.name+' '+e.variant.name).toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderStats(){
  const owned=ENTRIES.filter(e=>st(e.key).owned).length;
  const mast=ENTRIES.filter(e=>st(e.key).mastered).length;
  const t=ENTRIES.length;
  stats.innerHTML=[
    ['Collected',`${owned}<span>/${t}</span>`],
    ['Missing',t-owned],
    ['Mastered',`${mast}<span>/${owned||0}</span>`],
    ['Not mastered',owned-mast],
    ['Complete',Math.round(owned/t*100)+'%']
  ].map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
}

function renderFilters(){
  const S=[['all','All'],['owned','Collected'],['missing','Missing'],
           ['mastered','Mastered'],['unmastered','Not mastered']];
  fStatus.innerHTML=S.map(([v,l])=>
    `<button class="chip ${filters.status===v?'on':''}" data-s="${v}">${l}</button>`).join('');
  fRarity.innerHTML=`<button class="chip ${filters.rarity==='all'?'on':''}" data-r="all">All rarities</button>`+
    DB.rarities.map(r=>`<button class="chip ${filters.rarity===r.id?'on':''}" data-r="${r.id}">${r.name}</button>`).join('');
}

function cardHTML(e){
  const s=st(e.key), col=DB.rarities.find(r=>r.id===e.sprite.rarity).color;
  return `<div class="card ${s.owned?'owned':''} ${s.mastered?'mastered':''}"
    style="--r:${col}" data-k="${e.key}">
    <button class="star" data-star="${e.key}" aria-label="Toggle mastered">★</button>
    ${e.img
      ? `<img class="art" src="${e.img}" alt="" loading="lazy" decoding="async">`
      : `<div class="art">${e.sprite.name[0]}</div>`}
    <div class="nm">${e.sprite.name}</div>
    <div class="vr">${e.variant.name}${
      s.owned && !s.mastered && s.level ? ` · Lv${s.level}` : ''}</div>
  </div>`;
}

function render(){
  renderStats(); renderFilters();
  const list=visible();
  if(!list.length){ content.innerHTML='<p class="empty">Nothing matches those filters.</p>'; return }
  let html='';
  for(const r of DB.rarities){
    const g=list.filter(e=>e.sprite.rarity===r.id);
    if(!g.length) continue;
    const own=g.filter(e=>st(e.key).owned).length;
    html+=`<div class="group-title" style="color:${r.color}">${r.name} · ${own}/${g.length}</div>
      <div class="grid">${g.map(cardHTML).join('')}</div>`;
  }
  content.innerHTML=html;
}

// --- interaction ---
document.addEventListener('click',ev=>{
  const star=ev.target.closest('[data-star]');
  if(star){
    ev.stopPropagation();
    const k=star.dataset.star, s={...st(k)};
    s.mastered=!s.mastered; if(s.mastered) s.owned=true;
    state[k]=s; save(); render(); return;
  }
  const card=ev.target.closest('[data-k]');
  if(card){
    const k=card.dataset.k, s={...st(k)};
    s.owned=!s.owned; if(!s.owned) s.mastered=false;
    state[k]=s; save(); render(); return;
  }
  const c=ev.target.closest('.chip');
  if(c){
    if(c.dataset.s) filters.status=c.dataset.s;
    if(c.dataset.r) filters.rarity=c.dataset.r;
    render();
  }
});
search.addEventListener('input',e=>{filters.q=e.target.value;render()});

// --- export ---
exportBtn.onclick=()=>exportDlg.showModal();
exCancel.onclick=()=>exportDlg.close();
exGo.onclick=()=>{ exportDlg.close(); drawPNG(exView.value,exGroup.value) };

function exportSet(view){
  return ENTRIES.filter(e=>{
    const s=st(e.key);
    if(view==='owned') return s.owned;
    if(view==='missing') return !s.owned;
    if(view==='mastered') return s.mastered;
    if(view==='unmastered') return s.owned && !s.mastered;
    return true;
  });
}

// Load with crossOrigin so the canvas stays exportable. If the host sends no
// CORS headers the load fails (rather than tainting the canvas) and we fall
// back to a coloured letter tile — export must never break.
function loadArt(url){
  return new Promise(res=>{
    if(!url) return res(null);
    const i=new Image();
    i.crossOrigin='anonymous';
    i.onload=()=>res(i);
    i.onerror=()=>res(null);
    i.src=url;
    setTimeout(()=>res(null),6000);
  });
}

async function drawPNG(view,groupBy){
  const list=exportSet(view);
  if(!list.length){ alert('Nothing to export for that selection.'); return }

  const art=new Map();
  await Promise.all([...new Set(list.map(e=>e.img).filter(Boolean))]
    .map(async u=>art.set(u,await loadArt(u))));

  const S=2, CW=124, CH=140, GAP=12, PAD=32, COLS=Math.min(8,Math.max(4,Math.ceil(Math.sqrt(list.length))));
  // group
  let groups=[];
  if(groupBy==='rarity')
    groups=DB.rarities.map(r=>({t:r.name,c:r.color,items:list.filter(e=>e.sprite.rarity===r.id)})).filter(g=>g.items.length);
  else if(groupBy==='sprite')
    groups=DB.sprites.map(s=>({t:s.name,c:DB.rarities.find(r=>r.id===s.rarity).color,
      items:list.filter(e=>e.sprite.id===s.id)})).filter(g=>g.items.length);
  else groups=[{t:null,items:list}];

  const HEAD=150, HDR=46;
  let h=HEAD;
  for(const g of groups){
    g.rows=Math.ceil(g.items.length/COLS);
    h+=(g.t?HDR:0)+g.rows*(CH+GAP);
  }
  h+=PAD+34;
  const w=PAD*2+COLS*CW+(COLS-1)*GAP;

  const cv=document.createElement('canvas');
  cv.width=w*S; cv.height=h*S;
  const x=cv.getContext('2d'); x.scale(S,S);
  x.fillStyle='#0d0f16'; x.fillRect(0,0,w,h);

  const owned=ENTRIES.filter(e=>st(e.key).owned).length;
  const mast=ENTRIES.filter(e=>st(e.key).mastered).length;
  const T=ENTRIES.length;
  const label={all:'All Sprites',owned:'Collected',missing:'Missing',
    mastered:'Mastered',unmastered:'Collected · Not Mastered'}[view];

  x.fillStyle='#e8ecf6'; x.font='700 30px system-ui,sans-serif';
  x.fillText('Sprite Index — '+label,PAD,PAD+30);
  x.fillStyle='#8b94ad'; x.font='400 16px system-ui,sans-serif';
  x.fillText(`${owned}/${T} collected · ${mast} mastered · ${T-owned} missing · ${list.length} shown`,PAD,PAD+58);
  x.fillText(new Date().toLocaleDateString(),PAD,PAD+82);
  x.fillStyle='#2a3145'; x.fillRect(PAD,PAD+100,w-PAD*2,1);

  const rr=(a,b,c,d,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+c,b,a+c,b+d,r);
    x.arcTo(a+c,b+d,a,b+d,r);x.arcTo(a,b+d,a,b,r);x.arcTo(a,b,a+c,b,r);x.closePath()};

  let y=HEAD;
  for(const g of groups){
    if(g.t){
      x.fillStyle=g.c||'#8b94ad'; x.font='700 15px system-ui,sans-serif';
      const on=g.items.filter(e=>st(e.key).owned).length;
      x.fillText(g.t.toUpperCase()+'  ·  '+on+'/'+g.items.length,PAD,y+26);
      y+=HDR;
    }
    g.items.forEach((e,i)=>{
      const cx=PAD+(i%COLS)*(CW+GAP), cy=y+Math.floor(i/COLS)*(CH+GAP);
      const s=st(e.key), col=DB.rarities.find(r=>r.id===e.sprite.rarity).color;
      const dim=!s.owned;

      x.globalAlpha=dim?.3:1;
      x.fillStyle=dim?'#161a26':'#1e2333'; rr(cx,cy,CW,CH,14); x.fill();
      x.strokeStyle=s.mastered?'#F5C542':(dim?'#2a3145':col);
      x.lineWidth=s.mastered?2.5:1.5; rr(cx,cy,CW,CH,14); x.stroke();

      const im=e.img?art.get(e.img):null;
      x.textAlign='center';
      if(im){
        x.drawImage(im,cx+CW/2-27,cy+18,54,54);
      } else {
        x.fillStyle=col; rr(cx+CW/2-27,cy+18,54,54,13); x.fill();
        x.fillStyle='#0c0e14'; x.font='800 24px system-ui,sans-serif';
        x.fillText(e.sprite.name[0],cx+CW/2,cy+53);
      }

      x.fillStyle='#e8ecf6'; x.font='650 14px system-ui,sans-serif';
      let nm=e.sprite.name;
      while(x.measureText(nm).width>CW-16 && nm.length>3) nm=nm.slice(0,-1);
      if(nm!==e.sprite.name) nm=nm.slice(0,-1)+'…';
      x.fillText(nm,cx+CW/2,cy+94);
      x.fillStyle='#8b94ad'; x.font='400 12px system-ui,sans-serif';
      x.fillText(e.variant.name,cx+CW/2,cy+112);

      if(s.mastered){
        x.fillStyle='#F5C542'; x.font='700 11px system-ui,sans-serif';
        x.fillText('★ MASTERED',cx+CW/2,cy+130);
      } else if(!s.owned){
        x.fillStyle='#6b748a';
        x.font='700 11px system-ui,sans-serif';
        x.fillText('MISSING',cx+CW/2,cy+130);
      }
      x.textAlign='left'; x.globalAlpha=1;
    });
    y+=g.rows*(CH+GAP);
  }

  x.fillStyle='#4a5268'; x.font='400 12px system-ui,sans-serif';
  x.fillText('Sprite Index',PAD,h-PAD+12);

  try{
    cv.toBlob(b=>{
      if(!b){ alert('Export failed while encoding the image.'); return }
      const u=URL.createObjectURL(b), a=document.createElement('a');
      a.href=u; a.download=`sprite-index-${view}-${new Date().toISOString().slice(0,10)}.png`;
      a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000);
    },'image/png');
  }catch(err){
    alert('Export failed: '+err.message);
  }
}

// --- data menu ---
menuBtn.onclick=()=>menuDlg.showModal();
menuClose.onclick=()=>menuDlg.close();
backupBtn.onclick=()=>{
  const b=new Blob([JSON.stringify({v:1,saved:new Date().toISOString(),state},null,2)],
    {type:'application/json'});
  const u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download='sprite-index-backup.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
};
importBtn.onclick=()=>importFile.click();
importFile.onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const r=importExport(JSON.parse(await f.text()));
    menuDlg.close();
    alert(`Imported ${r.applied} of ${r.total} sprites from SpriteTrading.`);
  }catch(err){ alert('Could not read that file: '+err.message) }
  e.target.value='';
};
restoreBtn.onclick=()=>restoreFile.click();
restoreFile.onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const d=JSON.parse(await f.text());
    if(!d.state) throw 0;
    state=d.state; save(); render(); menuDlg.close();
    alert('Progress restored.');
  }catch{ alert('That file is not a valid backup.') }
};
resetBtn.onclick=()=>{
  if(confirm('Erase all collected/mastered progress on this device?')){
    state={}; save(); render(); menuDlg.close();
  }
};

// --- boot ---
fetch('data/sprites.json').then(r=>r.json()).then(d=>{
  DB=d; buildEntries(); render();
}).catch(()=>{
  content.innerHTML='<p class="empty">Could not load sprite data.</p>';
});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
