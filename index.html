<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f16">
<title>Sprite Index</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0d0f16; --panel:#161a26; --panel2:#1e2333; --line:#2a3145;
  --text:#e8ecf6; --dim:#8b94ad; --accent:#4dd4ff;
  --rare:#3AA7F0; --epic:#A64BF4; --legendary:#F0862E; --mythic:#F5C542;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:20;background:rgba(13,15,22,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-top)) ;padding-top:calc(10px + env(safe-area-inset-top))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;flex:1}
button,select,input{font:inherit;color:var(--text);background:var(--panel2);
  border:1px solid var(--line);border-radius:9px;padding:8px 11px}
button{cursor:pointer}
button:active{transform:scale(.97)}
.btn-accent{background:var(--accent);color:#04202b;border-color:transparent;font-weight:650}
input[type=search]{flex:1;min-width:120px}

/* creator-code bar */
.creator{display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;
  background:linear-gradient(90deg,var(--accent),#7ee6ff);color:#04202b;
  border:0;width:100%;padding:8px 12px;border-radius:10px;margin-bottom:10px;
  font-size:12.5px;font-weight:700}
.creator .cc-tag{font-size:9.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
  background:rgba(4,32,43,.85);color:#bff2ff;padding:2px 7px;border-radius:6px}
.creator b{font-size:15px;font-weight:900;letter-spacing:1px}
.creator .cc-note{color:#04374a;font-weight:600;font-size:11.5px}
@media (max-width:420px){.creator .cc-note{display:none}}

.filters{display:flex;gap:6px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.chip{border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;
  background:var(--panel);border:1px solid var(--line);color:var(--dim)}
.chip.on{background:var(--accent);color:#04202b;border-color:transparent;font-weight:650}

main{padding:12px}

/* hero: big collected count + variant breakdown */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:16px 16px 18px;margin-bottom:16px}
.hero-count{display:flex;align-items:baseline;gap:9px}
.hero-count b{font-size:38px;font-weight:800;line-height:1;letter-spacing:-.5px}
.hero-count span{color:var(--dim);font-size:15px}
.hero-sub{display:flex;align-items:center;gap:14px;margin:12px 0 10px;font-size:14px;flex-wrap:wrap}
.hero-sub .hs-sync{color:var(--accent);font-weight:600}
.hero-sub .hs-mast{color:var(--mythic);font-weight:700}
.hero-sub .hs-pct{margin-left:auto;font-size:22px;font-weight:800;color:var(--mythic)}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--mythic),#ffe082)}
.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;margin-top:16px}
.bd-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.bd-top span{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--dim)}
.bd-top b{font-size:14px;font-weight:700}
.bd-bar{height:5px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bd-bar>i{display:block;height:100%;border-radius:99px;background:var(--c)}

.group-title{display:flex;align-items:center;gap:8px;margin:18px 0 11px;font-size:13px;
  text-transform:uppercase;letter-spacing:.9px;font-weight:700}
.group-title::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}

/* big collectible cards */
.card{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  background:var(--panel2);cursor:pointer;transition:transform .1s,border-color .12s}
.card:active{transform:scale(.98)}
.card.mastered{border-color:var(--mythic)}
.card:not(.owned){filter:grayscale(.95);opacity:.5}
.art-wrap{position:relative;aspect-ratio:1/1;display:grid;place-items:center;padding:16px}
.art-wrap::before{content:"";position:absolute;inset:0;background:var(--vc);opacity:.28}
.art-wrap::after{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 80% at 50% 12%,transparent,rgba(13,15,22,.55))}
.art{position:relative;z-index:1;width:82%;height:82%;object-fit:contain;
  filter:drop-shadow(0 8px 16px rgba(0,0,0,.55))}
.art-fallback{position:relative;z-index:1;width:64%;height:64%;border-radius:16px;
  display:grid;place-items:center;font:800 34px/1 system-ui,sans-serif;
  color:#0c0e14;background:var(--vc)}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 11px 0}
.tag-mast{color:var(--mythic);font-weight:800;font-size:10.5px;letter-spacing:.5px}
.tag-miss{color:var(--dim);font-weight:800;font-size:10.5px;letter-spacing:.5px}
.tag-lvl{color:var(--accent);font-weight:800;font-size:10.5px;letter-spacing:.5px}
.tag-rarity{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;
  padding:3px 8px;border-radius:7px;background:var(--r);color:#0c0e14;white-space:nowrap}
.nm{padding:4px 11px 12px;font-weight:700;font-size:14px;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--dim);text-align:center;padding:40px 12px}

#refreshBtn{padding:8px 10px;line-height:1}
#refreshBtn .ico{display:inline-block}
#refreshBtn[data-busy] .ico{animation:spin .8s linear infinite}
#refreshBtn[disabled]{opacity:.6}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#refreshBtn[data-busy] .ico{animation:none}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  padding:10px 16px;border-radius:999px;font-size:13px;z-index:60;
  box-shadow:0 6px 24px rgba(0,0,0,.45);opacity:0;transition:opacity .18s}
.toast.on{opacity:1}
.toast.bad{border-color:var(--legendary);color:var(--legendary)}

/* --- sprite info panel --- */
#infoDlg{width:min(94vw,430px)}
.info-head{position:relative;overflow:hidden;text-align:center;
  padding:24px 16px 18px;border-bottom:1px solid var(--line)}
.info-head::before{content:"";position:absolute;inset:0;background:var(--vc);opacity:.22}
.info-head::after{content:"";position:absolute;inset:0;
  background:radial-gradient(130% 90% at 50% 0,transparent,var(--panel))}
.info-art{position:relative;z-index:1;width:118px;height:118px;margin:0 auto 12px;
  object-fit:contain;filter:drop-shadow(0 10px 20px rgba(0,0,0,.55));
  display:grid;place-items:center;font:800 46px/1 system-ui,sans-serif;color:#0c0e14}
.info-head h2{position:relative;z-index:1;margin:0;font-size:22px;line-height:1.2}
.info-sub{position:relative;z-index:1;color:var(--dim);font-size:13px;margin-top:4px}
.pill{position:relative;z-index:1;display:inline-block;font-size:11px;font-weight:800;
  letter-spacing:.5px;text-transform:uppercase;padding:4px 11px;border-radius:999px;
  margin-top:10px;background:var(--r);color:#0c0e14}
.pill.miss{background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.info-body{padding:4px 16px 16px;max-height:min(52vh,440px);overflow-y:auto}
.info-sec{margin-top:14px}
.info-sec h3{margin:0 0 4px;font-size:11px;letter-spacing:.9px;text-transform:uppercase;
  color:var(--dim);font-weight:700}
.info-sec p{margin:0;font-size:13.5px;color:var(--text);line-height:1.45}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.fact{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.fact b{display:block;font-size:14px;font-weight:700}
.fact span{font-size:11px;color:var(--dim)}
.info-foot{padding:0 16px 16px}
.info-foot button{width:100%}

dialog{border:1px solid var(--line);background:var(--panel);color:var(--text);
  border-radius:14px;padding:0;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg-body{padding:16px}
.dlg-body h2{margin:0 0 4px;font-size:16px}
.dlg-body p{margin:0 0 14px;color:var(--dim);font-size:13px}
.dlg-body label{display:block;font-size:12px;color:var(--dim);margin:10px 0 5px}
.dlg-body select{width:100%}
.dlg-actions{display:flex;gap:8px;margin-top:16px}
.dlg-actions button{flex:1}

/* epic login button */
.btn-epic{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border:none;font-weight:650}
.btn-epic.linked{background:var(--panel2);border:1px solid var(--accent);color:var(--accent)}
.epic-code{font-size:28px;font-weight:800;letter-spacing:6px;color:var(--accent);
  background:var(--panel2);padding:12px 20px;border-radius:10px;margin:12px 0}
.epic-waiting{color:var(--dim);font-size:13px}
.epic-waiting::after{content:'';animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

/* profile area */
#profileArea{display:flex;align-items:center;gap:8px}
.profile-btn{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:6px 12px 6px 6px;cursor:pointer}
.profile-btn:hover{border-color:var(--accent)}
.profile-avatar{width:32px;height:32px;border-radius:8px;object-fit:cover;background:var(--panel)}
.profile-name{font-size:13px;font-weight:600;color:var(--text);max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.login-prompt{font-size:12px;color:var(--dim)}
</style>
</head>
<body>

<header>
  <button class="creator" id="creatorBar" title="Copy creator code">
    <span class="cc-tag">Creator Code</span>
    <b>RDOTA</b>
    <span class="cc-note">Use in the Item Shop · #EpicPartner</span>
  </button>
  <div class="row">
    <h1>Sprite Index</h1>
    <button id="refreshBtn" aria-label="Check for new sprites" title="Check for new sprites"><span class="ico">↻</span></button>
    <button id="exportBtn" class="btn-accent">Export</button>
    <div id="profileArea"></div>
  </div>
  <div class="row" style="margin-top:9px">
    <input type="search" id="search" placeholder="Search sprites…" autocomplete="off">
  </div>
  <div class="filters" id="fStatus"></div>
  <div class="filters" id="fRarity"></div>
</header>

<main><div id="content"></div></main>

<dialog id="exportDlg"><div class="dlg-body">
  <h2>Export image</h2>
  <p>Saves a PNG of your index.</p>
  <label for="exView">Show</label>
  <select id="exView">
    <option value="all">All sprites — uncollected greyed out</option>
    <option value="owned">Collected only</option>
    <option value="missing">Missing only</option>
    <option value="mastered">Mastered only</option>
    <option value="unmastered">Collected but NOT mastered</option>
  </select>
  <label for="exGroup">Group by</label>
  <select id="exGroup">
    <option value="rarity">Rarity</option>
    <option value="sprite">Sprite</option>
    <option value="none">Nothing — one grid</option>
  </select>
  <div class="dlg-actions">
    <button id="exCancel">Cancel</button>
    <button id="exGo" class="btn-accent">Save PNG</button>
  </div>
</div></dialog>

<dialog id="infoDlg">
  <div class="info-head" id="infoHead"></div>
  <div class="info-body" id="infoBody"></div>
  <div class="info-foot"><button id="infoClose" class="btn-accent">Close</button></div>
</dialog>

<dialog id="epicDlg"><div class="dlg-body">
  <h2 id="epicTitle">Link Your Epic Account</h2>
  <p id="epicDesc">Automatically sync your Fortnite locker to see which sprites you own.</p>
  <div id="epicContent"></div>
  <div class="dlg-actions">
    <button id="epicClose">Cancel</button>
  </div>
</div></dialog>


<script>
const KEY='spriteIndex.v1', CATKEY='spriteIndex.catalog.v1';
let DB=null, state=load(), catalog=loadCat(), filters={status:'all',rarity:'all',q:''};

function load(){ try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}} }
function save(){ localStorage.setItem(KEY,JSON.stringify(state)) }
function loadCat(){ try{return JSON.parse(localStorage.getItem(CATKEY))||null}catch{return null} }
const uid=(s,v)=>s+':'+v;
const st=k=>state[k]||{owned:false,mastered:false};

const norm=s=>(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const findSprite=name=>DB.sprites.find(s=>norm(s.name)===norm(name))
  || DB.sprites.find(s=>norm(s.id)===norm(name));
const findVariant=name=>DB.variants.find(v=>norm(v.name)===norm(name))
  || (norm(name)==='base' ? DB.variants.find(v=>v.id==='normal') : null);

// Entries come from an imported SpriteTrading catalog when we have one —
// that's authoritative for which variants actually exist per sprite.
// Otherwise fall back to the shipped (partly inferred) database.
let ENTRIES=[];
function buildEntries(){
  ENTRIES=[];
  if(catalog && catalog.entries && catalog.entries.length){
    for(const e of catalog.entries){
      const s=findSprite(e.sprite);
      const v=findVariant(e.variant);
      const vid=v?v.id:norm(e.variant);
      ENTRIES.push({
        key:uid(s?s.id:norm(e.sprite),vid),
        sprite:s||{id:norm(e.sprite),name:e.sprite,
          rarity:(e.rarity||'rare').toLowerCase(),ability:'',howToGet:''},
        variantId:vid,
        variant:v||{id:vid,name:e.variant,effect:''},
        img:e.img||null,
        raw:e            // dust cost, dex number, acquired date - for the info panel
      });
    }
    // Keep the shipped rarity where we have it; "Special" isn't a real tier.
    for(const e of ENTRIES)
      if(!DB.rarities.some(r=>r.id===e.sprite.rarity)) e.sprite.rarity='rare';
  } else {
    for(const s of DB.sprites)
      for(const v of s.variants)
        ENTRIES.push({key:uid(s.id,v),sprite:s,variantId:v,
          variant:DB.variants.find(x=>x.id===v),img:null});
  }
}

// Apply a spritetrading-export.json file.
function importExport(d){
  if(!d || !Array.isArray(d.entries)) throw new Error('not a SpriteTrading export');
  catalog={entries:d.entries};
  localStorage.setItem(CATKEY,JSON.stringify(catalog));
  buildEntries();
  const byKey=new Map(ENTRIES.map(e=>[e.key,e]));
  let n=0;
  for(const e of d.entries){
    const s=findSprite(e.sprite), v=findVariant(e.variant);
    const k=uid(s?s.id:norm(e.sprite), v?v.id:norm(e.variant));
    if(!byKey.has(k)) continue;
    state[k]={owned:!!e.collected, mastered:!!e.mastered, level:e.level||null};
    n++;
  }
  save(); render();
  return {applied:n, total:d.entries.length};
}

function visible(){
  const q=filters.q.trim().toLowerCase();
  return ENTRIES.filter(e=>{
    const s=st(e.key);
    if(filters.rarity!=='all' && e.sprite.rarity!==filters.rarity) return false;
    if(filters.status==='owned' && !s.owned) return false;
    if(filters.status==='missing' && s.owned) return false;
    if(filters.status==='mastered' && !s.mastered) return false;
    if(filters.status==='unmastered' && !(s.owned && !s.mastered)) return false;
    if(q && !(e.sprite.name+' '+e.variant.name).toLowerCase().includes(q)) return false;
    return true;
  });
}

// Per-variant colours (kept inside our palette), used for the breakdown bars
// and to tint each card the way spritetrading tints its cards.
const VCOL={normal:'#8b94ad',base:'#8b94ad',gold:'#F5C542',gummy:'#4dd4ff',
  galaxy:'#A64BF4',gem:'#3ddc97',holofoil:'#ff6ec7',cube:'#F0862E',quack:'#7bd88f'};
const vcol=id=>VCOL[(id||'').toLowerCase()]||'#8b94ad';
const VORDER=[['normal','Base'],['gold','Gold'],['gummy','Gummy'],['galaxy','Galaxy'],
  ['gem','Gem'],['holofoil','Holofoil'],['cube','Cube'],['quack','Quack']];
let syncedAt=null;

function fmtSync(when){
  if(!when) return '';
  const d=new Date(when);
  return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
}

function renderHero(){
  const owned=ENTRIES.filter(e=>st(e.key).owned).length;
  const mast=ENTRIES.filter(e=>st(e.key).mastered).length;
  const t=ENTRIES.length||1;
  const pct=Math.round(owned/t*100);

  const m={};
  for(const e of ENTRIES){
    const id=(e.variantId||'').toLowerCase();
    (m[id]=m[id]||{o:0,t:0}); m[id].t++; if(st(e.key).owned) m[id].o++;
  }
  const bd=VORDER.filter(([id])=>m[id]&&m[id].t).map(([id,label])=>{
    const c=m[id]; return `<div class="bd">
      <div class="bd-top"><span>${label}</span><b>${c.o}/${c.t}</b></div>
      <div class="bd-bar"><i style="--c:${vcol(id)};width:${Math.round(c.o/c.t*100)}%"></i></div>
    </div>`;
  }).join('');

  return `<section class="hero">
    <div class="hero-count"><b>${owned}</b><span>of ${t} sprites collected</span></div>
    <div class="hero-sub">
      ${syncedAt?`<span class="hs-sync">⚡ Synced ${fmtSync(syncedAt)}</span>`:''}
      <span class="hs-mast">★ ${mast} mastered</span>
      <span class="hs-pct">${pct}%</span>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="breakdown">${bd}</div>
  </section>`;
}

function renderFilters(){
  const S=[['all','All'],['owned','Collected'],['missing','Missing'],
           ['mastered','Mastered'],['unmastered','Not mastered']];
  fStatus.innerHTML=S.map(([v,l])=>
    `<button class="chip ${filters.status===v?'on':''}" data-s="${v}">${l}</button>`).join('');
  fRarity.innerHTML=`<button class="chip ${filters.rarity==='all'?'on':''}" data-r="all">All rarities</button>`+
    DB.rarities.map(r=>`<button class="chip ${filters.rarity===r.id?'on':''}" data-r="${r.id}">${r.name}</button>`).join('');
}

function cardHTML(e){
  const s=st(e.key), col=DB.rarities.find(r=>r.id===e.sprite.rarity).color;
  const vc=vcol(e.variantId);
  const name=e.variant.name==='Normal'?e.sprite.name:`${e.variant.name} ${e.sprite.name}`;
  const status=s.mastered ? '<span class="tag-mast">★ MASTERED</span>'
    : s.owned ? (s.level?`<span class="tag-lvl">LVL ${s.level}</span>`:'<span class="tag-lvl">COLLECTED</span>')
    : '<span class="tag-miss">MISSING</span>';
  return `<div class="card ${s.owned?'owned':''} ${s.mastered?'mastered':''}"
    style="--r:${col};--vc:${vc}" data-k="${e.key}">
    <div class="art-wrap">
      ${e.img
        ? `<img class="art" src="${e.img}" alt="" loading="lazy" decoding="async">`
        : `<div class="art-fallback">${e.sprite.name[0]}</div>`}
    </div>
    <div class="card-foot">${status}<span class="tag-rarity">${e.sprite.rarity}</span></div>
    <div class="nm">${name}</div>
  </div>`;
}

function render(){
  renderFilters();
  const list=visible();
  let html=renderHero();
  if(!list.length){
    content.innerHTML=html+'<p class="empty">Nothing matches those filters.</p>'; return;
  }
  for(const r of DB.rarities){
    const g=list.filter(e=>e.sprite.rarity===r.id);
    if(!g.length) continue;
    const own=g.filter(e=>st(e.key).owned).length;
    html+=`<div class="group-title" style="color:${r.color}">${r.name} · ${own}/${g.length}</div>
      <div class="grid">${g.map(cardHTML).join('')}</div>`;
  }
  content.innerHTML=html;
}

// --- interaction ---
// Collection state comes from the synced export, so a tap opens the details
// rather than changing anything.
document.addEventListener('click',ev=>{
  const c=ev.target.closest('.chip');
  if(c){
    if(c.dataset.s) filters.status=c.dataset.s;
    if(c.dataset.r) filters.rarity=c.dataset.r;
    render();
    return;
  }
  const card=ev.target.closest('[data-k]');
  if(card) openInfo(card.dataset.k);
});
search.addEventListener('input',e=>{filters.q=e.target.value;render()});

// --- sprite info ---
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtNum=n=>Number(n).toLocaleString();

function openInfo(key){
  const e=ENTRIES.find(x=>x.key===key);
  if(!e) return;
  const s=st(e.key), r=DB.rarities.find(x=>x.id===e.sprite.rarity), col=r.color;
  const vc=vcol(e.variantId);
  const raw=e.raw||{};
  const name=e.variant.name==='Normal'?e.sprite.name:`${e.variant.name} ${e.sprite.name}`;

  const status=s.mastered ? '★ Mastered'
    : s.owned ? (s.level ? 'Collected · Level '+s.level : 'Collected')
    : 'Not collected';

  infoHead.style.setProperty('--vc',vc);
  infoHead.innerHTML=`
    ${e.img
      ? `<img class="info-art" src="${esc(e.img)}" alt="">`
      : `<div class="info-art" style="background:${vc}">${esc(e.sprite.name[0])}</div>`}
    <h2>${esc(name)}</h2>
    <div class="info-sub">${esc(e.variant.name)} variant</div>
    <span class="pill ${s.owned?'':'miss'}" style="--r:${col}">${esc(s.owned?r.name:'Missing')}</span>`;

  // Only show sections we actually have text for - an empty heading is noise.
  const secs=[
    ['Status', status],
    ['Ability', e.sprite.ability],
    ['How to get', e.sprite.howToGet],
    [e.variant.name+' variant', e.variant.effect],
  ].filter(([,v])=>v);

  // How many variants of this same sprite you hold.
  const fam=ENTRIES.filter(x=>x.sprite.id===e.sprite.id);
  const famOwned=fam.filter(x=>st(x.key).owned).length;

  const facts=[
    raw.cost ? [fmtNum(raw.cost)+' dust', 'Summon cost'] : null,
    raw.dex ? ['#'+raw.dex, 'Index number'] : null,
    [famOwned+'/'+fam.length, 'Variants collected'],
    (s.owned && raw.acquired)
      ? [new Date(raw.acquired).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}), 'Acquired']
      : null,
  ].filter(Boolean);

  infoBody.innerHTML=
    secs.map(([h,v])=>`<div class="info-sec"><h3>${esc(h)}</h3><p>${esc(v)}</p></div>`).join('')+
    `<div class="facts">${facts.map(([b,l])=>
      `<div class="fact"><b>${esc(b)}</b><span>${esc(l)}</span></div>`).join('')}</div>`;

  infoDlg.showModal();
}

function exportSet(view){
  return ENTRIES.filter(e=>{
    const s=st(e.key);
    if(view==='owned') return s.owned;
    if(view==='missing') return !s.owned;
    if(view==='mastered') return s.mastered;
    if(view==='unmastered') return s.owned && !s.mastered;
    return true;
  });
}

// Load with crossOrigin so the canvas stays exportable. If the host sends no
// CORS headers the load fails (rather than tainting the canvas) and we fall
// back to a coloured letter tile — export must never break.
function loadArt(url){
  return new Promise(res=>{
    if(!url) return res(null);
    const i=new Image();
    i.crossOrigin='anonymous';
    i.onload=()=>res(i);
    i.onerror=()=>res(null);
    i.src=url;
    setTimeout(()=>res(null),6000);
  });
}

async function drawPNG(view,groupBy){
  const list=exportSet(view);
  if(!list.length){ alert('Nothing to export for that selection.'); return }

  const art=new Map();
  await Promise.all([...new Set(list.map(e=>e.img).filter(Boolean))]
    .map(async u=>art.set(u,await loadArt(u))));

  const S=2, CW=124, CH=140, GAP=12, PAD=32, COLS=Math.min(8,Math.max(4,Math.ceil(Math.sqrt(list.length))));
  // group
  let groups=[];
  if(groupBy==='rarity')
    groups=DB.rarities.map(r=>({t:r.name,c:r.color,items:list.filter(e=>e.sprite.rarity===r.id)})).filter(g=>g.items.length);
  else if(groupBy==='sprite')
    groups=DB.sprites.map(s=>({t:s.name,c:DB.rarities.find(r=>r.id===s.rarity).color,
      items:list.filter(e=>e.sprite.id===s.id)})).filter(g=>g.items.length);
  else groups=[{t:null,items:list}];

  const HEAD=150, HDR=46;
  let h=HEAD;
  for(const g of groups){
    g.rows=Math.ceil(g.items.length/COLS);
    h+=(g.t?HDR:0)+g.rows*(CH+GAP);
  }
  h+=PAD+34;
  const w=PAD*2+COLS*CW+(COLS-1)*GAP;

  const cv=document.createElement('canvas');
  cv.width=w*S; cv.height=h*S;
  const x=cv.getContext('2d'); x.scale(S,S);
  x.fillStyle='#0d0f16'; x.fillRect(0,0,w,h);

  const owned=ENTRIES.filter(e=>st(e.key).owned).length;
  const mast=ENTRIES.filter(e=>st(e.key).mastered).length;
  const T=ENTRIES.length;
  const label={all:'All Sprites',owned:'Collected',missing:'Missing',
    mastered:'Mastered',unmastered:'Collected · Not Mastered'}[view];

  x.fillStyle='#e8ecf6'; x.font='700 30px system-ui,sans-serif';
  x.fillText('Sprite Index — '+label,PAD,PAD+30);
  x.fillStyle='#8b94ad'; x.font='400 16px system-ui,sans-serif';
  x.fillText(`${owned}/${T} collected · ${mast} mastered · ${T-owned} missing · ${list.length} shown`,PAD,PAD+58);
  x.fillText(new Date().toLocaleDateString(),PAD,PAD+82);
  x.fillStyle='#2a3145'; x.fillRect(PAD,PAD+100,w-PAD*2,1);

  const rr=(a,b,c,d,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+c,b,a+c,b+d,r);
    x.arcTo(a+c,b+d,a,b+d,r);x.arcTo(a,b+d,a,b,r);x.arcTo(a,b,a+c,b,r);x.closePath()};

  let y=HEAD;
  for(const g of groups){
    if(g.t){
      x.fillStyle=g.c||'#8b94ad'; x.font='700 15px system-ui,sans-serif';
      const on=g.items.filter(e=>st(e.key).owned).length;
      x.fillText(g.t.toUpperCase()+'  ·  '+on+'/'+g.items.length,PAD,y+26);
      y+=HDR;
    }
    g.items.forEach((e,i)=>{
      const cx=PAD+(i%COLS)*(CW+GAP), cy=y+Math.floor(i/COLS)*(CH+GAP);
      const s=st(e.key), col=DB.rarities.find(r=>r.id===e.sprite.rarity).color;
      const dim=!s.owned;

      x.globalAlpha=dim?.3:1;
      x.fillStyle=dim?'#161a26':'#1e2333'; rr(cx,cy,CW,CH,14); x.fill();
      x.strokeStyle=s.mastered?'#F5C542':(dim?'#2a3145':col);
      x.lineWidth=s.mastered?2.5:1.5; rr(cx,cy,CW,CH,14); x.stroke();

      const im=e.img?art.get(e.img):null;
      x.textAlign='center';
      if(im){
        x.drawImage(im,cx+CW/2-27,cy+18,54,54);
      } else {
        x.fillStyle=col; rr(cx+CW/2-27,cy+18,54,54,13); x.fill();
        x.fillStyle='#0c0e14'; x.font='800 24px system-ui,sans-serif';
        x.fillText(e.sprite.name[0],cx+CW/2,cy+53);
      }

      x.fillStyle='#e8ecf6'; x.font='650 14px system-ui,sans-serif';
      let nm=e.sprite.name;
      while(x.measureText(nm).width>CW-16 && nm.length>3) nm=nm.slice(0,-1);
      if(nm!==e.sprite.name) nm=nm.slice(0,-1)+'…';
      x.fillText(nm,cx+CW/2,cy+94);
      x.fillStyle='#8b94ad'; x.font='400 12px system-ui,sans-serif';
      x.fillText(e.variant.name,cx+CW/2,cy+112);

      if(s.mastered){
        x.fillStyle='#F5C542'; x.font='700 11px system-ui,sans-serif';
        x.fillText('★ MASTERED',cx+CW/2,cy+130);
      } else if(!s.owned){
        x.fillStyle='#6b748a';
        x.font='700 11px system-ui,sans-serif';
        x.fillText('MISSING',cx+CW/2,cy+130);
      }
      x.textAlign='left'; x.globalAlpha=1;
    });
    y+=g.rows*(CH+GAP);
  }

  x.fillStyle='#4a5268'; x.font='400 12px system-ui,sans-serif';
  x.fillText('Sprite Index',PAD,h-PAD+12);

  try{
    cv.toBlob(b=>{
      if(!b){ alert('Export failed while encoding the image.'); return }
      const u=URL.createObjectURL(b), a=document.createElement('a');
      a.href=u; a.download=`sprite-index-${view}-${new Date().toISOString().slice(0,10)}.png`;
      a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000);
    },'image/png');
  }catch(err){
    alert('Export failed: '+err.message);
  }
}

// --- toast ---
let toastEl=null, toastT=0;
function toast(msg,bad){
  if(!toastEl){
    toastEl=document.createElement('div');
    document.body.appendChild(toastEl);
  }
  toastEl.className='toast'+(bad?' bad':'');
  toastEl.textContent=msg;
  requestAnimationFrame(()=>toastEl.classList.add('on'));
  clearTimeout(toastT);
  toastT=setTimeout(()=>toastEl.classList.remove('on'),2600);
}

// --- sync ---
const SYNCKEY='spriteIndex.lastSync';
const tally=()=>({
  owned:ENTRIES.filter(e=>st(e.key).owned).length,
  mast:ENTRIES.filter(e=>st(e.key).mastered).length
});

// The published collection is what makes the app self-updating. It runs on
// open, and the ↻ button runs it on demand for when you've just finished a
// match and don't want to wait for the next visit.
async function pullCollection(manual){
  if(manual){ refreshBtn.dataset.busy='1'; refreshBtn.disabled=true }
  const before=tally();
  try{
    const r=await fetch('data/collection.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    const stamp=d.exportedAt||'';
    // On open, skip the work when nothing has changed. On a manual refresh
    // always re-apply: pressing ↻ is a request to match the published data,
    // which is also how local state gets repaired if it ever drifts.
    if(manual || (stamp && stamp!==localStorage.getItem(SYNCKEY))){
      importExport(d);
      if(stamp) localStorage.setItem(SYNCKEY,stamp);
    }
    showSynced(stamp);
    if(manual){
      const after=tally();
      const bits=[];
      if(after.owned!==before.owned) bits.push((after.owned-before.owned>0?'+':'')+(after.owned-before.owned)+' collected');
      if(after.mast!==before.mast) bits.push((after.mast-before.mast>0?'+':'')+(after.mast-before.mast)+' mastered');
      toast(bits.length ? 'Updated · '+bits.join(' · ') : 'Already up to date');
    }
  }catch(err){
    // Offline or the file didn't load: keep whatever we already had.
    if(manual) toast('Could not reach the server — showing your last synced data',true);
  }finally{
    if(manual){ delete refreshBtn.dataset.busy; refreshBtn.disabled=false }
  }
}
refreshBtn.onclick=()=>pullCollection(true);

// The sync time lives in the hero now; just record it and repaint.
function showSynced(when){
  if(!when) return;
  syncedAt=when;
  render();
}

// --- epic oauth (exchange code flow) ---
const API_BASE = 'https://spritedex-api.abrasive-tax.workers.dev';
const EPIC_AUTH_URL = 'https://www.epicgames.com/id/api/redirect?clientId=ec684b8c687f479fadea3cb2ad83f5c6&responseType=code';

const epicAuth = {
  accountId: localStorage.getItem('epic_account_id'),
  displayName: localStorage.getItem('epic_display_name'),
  isLoggedIn(){ return !!this.accountId },

  async exchangeCode(code){
    console.log('Exchanging code...');
    const r = await fetch(`${API_BASE}/auth/exchange`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ code })
    });
    const d = await r.json();
    console.log('Exchange response:', d);
    if(d.error) throw new Error(d.error);

    this.accountId = d.account_id;
    this.displayName = d.display_name;
    localStorage.setItem('epic_account_id', d.account_id);
    localStorage.setItem('epic_display_name', d.display_name);
    return d;
  },

  async getLocker(token){
    if(!this.accountId) throw new Error('Not logged in');
    let url = `${API_BASE}/locker?account_id=${this.accountId}`;
    if(token) url += `&token=${encodeURIComponent(token)}`;
    console.log('Fetching locker from:', url);
    const r = await fetch(url);
    console.log('Response status:', r.status);
    const d = await r.json();
    console.log('Response data:', d);
    if(d.error) throw new Error(d.error);
    return d;
  },

  logout(){
    this.accountId = null;
    this.displayName = null;
    localStorage.removeItem('epic_account_id');
    localStorage.removeItem('epic_display_name');
  }
};

  epicTitle.textContent = 'Link Your Epic Account';

  epicContent.innerHTML = `

  epicDlg.showModal();

    } catch(err){
      epicContent.innerHTML = `<p style="color:var(--legendary)">Error: ${err.message}</p><p style="margin-top:12px"><button onclick="showLoginFlow()" class="btn-accent">Try Again</button></p>`;
    }
  };
}

async function syncFromEpic(token){
  const locker = await epicAuth.getLocker(token);
  window.lastLocker = locker; // save for debugging
  console.log('Epic returned:', locker);
  console.log('Template types:', locker.debug_template_types);
  console.log('Total items:', locker.total);
  console.log('Mimosa/Collectable items:', locker.cosmetics.filter(c => c.templateId && (c.templateId.includes('Mimosa') || c.templateId.includes('Collectable') || c.templateId.toLowerCase().includes('sprite'))));

  // Map Epic sprite tokens to sprite entries
  // Token format: "Token:athena_s41_spritemastery_token_qXX" or "Token:athena_s41_spritemastery_token_qXXy"
  // where XX = sprite number (01-26), y = variant letter (a-g)

  // Sprite mapping: q number -> sprite id (based on sprites.json order)
  const SPRITE_MAP = {
    '01': 'water', '02': 'earth', '03': 'fire', '04': 'fishy', '05': 'air',
    '06': 'duck', '07': 'ghost', '08': 'demon', '09': 'king', '10': 'aura',
    '11': 'striker', '12': 'shadow', '13': 'frost', '14': 'thunder', '15': 'nature',
    '16': 'crystal', '17': 'void', '18': 'phoenix', '19': 'dragon', '20': 'unicorn',
    '21': 'robot', '22': 'ninja', '23': 'pirate', '24': 'wizard', '25': 'knight', '26': 'alien'
  };

  // Variant mapping: letter -> variant id
  const VARIANT_MAP = {
    '': 'normal', 'a': 'gold', 'b': 'gummy', 'c': 'galaxy',
    'd': 'holofoil', 'e': 'gem', 'f': 'cube', 'g': 'quack'
  };

  for(const item of locker.cosmetics){
    const templateId = item.templateId || '';

    // Check if it's a sprite token
    if(templateId.startsWith('Token:athena_s41_spritemastery_token_q')){
      const tokenId = templateId.replace('Token:athena_s41_spritemastery_token_q', '');
      // Parse: "07a" -> sprite 07, variant a
      const match = tokenId.match(/^(\d+)([a-g]?)$/);
      if(match){
        const spriteNum = match[1].padStart(2, '0');
        const variantLetter = match[2] || '';

        const spriteId = SPRITE_MAP[spriteNum];
        const variantId = VARIANT_MAP[variantLetter];

        if(spriteId && variantId){
          const key = spriteId + ':' + variantId;
          // Find the entry and mark as owned
          const entry = ENTRIES.find(e => e.key === key);
          if(entry){
            state[key] = {
              owned: true,
              mastered: item.attributes?.completion_complete || false,
              level: item.attributes?.level || null
            };
          }
        }
      }
    }
  }

  console.log('Sprites synced! Owned:', Object.keys(state).filter(k => state[k]?.owned).length);

  save();
  render();
}

// --- boot ---
async function boot(){
  try{
    DB=await (await fetch('data/sprites.json',{cache:'no-cache'})).json();
  }catch{
    content.innerHTML='<p class="empty">Could not load sprite data.</p>'; return;
  }
  buildEntries();

  // If not logged in, clear state to show all as not collected
  if(!epicAuth.isLoggedIn()){
    state = {};
    save();
  }

  updateProfileArea();

  // If linked to Epic, sync from there
  if(epicAuth.isLoggedIn()){
    try{ await syncFromEpic(); }
    catch(e){ console.log('Sync failed:', e); render(); }
  }
}
boot();
