<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c12">
<title>Spritedex</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Burbank+Big+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Fortnite';
  src: local('Burbank Big Condensed Bold'), local('BurbankBigCondensed-Bold');
  font-weight: 700;
}
:root{
  --bg:#0a0c12; --bg2:#0f1118; --panel:#151820; --panel2:#1a1e28;
  --line:#252a38; --text:#f0f2f8; --dim:#6b7280; --accent:#00d4ff;
  --rare:#3AA7F0; --epic:#A855F7; --legendary:#F97316; --mythic:#FACC15;
  --glow:0 0 20px rgba(0,212,255,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);
  font:14px/1.5 'Inter',system-ui,-apple-system,sans-serif;
  min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}

/* header */
header{position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,rgba(10,12,18,.98) 0%,rgba(10,12,18,.95) 100%);
  backdrop-filter:blur(20px);border-bottom:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-top));padding-top:calc(12px + env(safe-area-inset-top))}
.header-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.logo{font:800 24px/1 'Fortnite','Burbank Big Condensed','Inter',sans-serif;
  letter-spacing:1px;text-transform:uppercase;
  background:linear-gradient(135deg,var(--accent),#00ffcc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-actions{display:flex;gap:8px;margin-left:auto;align-items:center}
button,select,input{font:inherit;color:var(--text);background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;padding:8px 14px;transition:all .15s}
button{cursor:pointer;font-weight:600}
button:hover{border-color:var(--accent);box-shadow:var(--glow)}
button:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--accent),#00ccff);
  color:#0a0c12;border:none;font-weight:700}
.btn-primary:hover{box-shadow:0 0 24px rgba(0,212,255,.5)}
input[type=search]{flex:1;min-width:200px;background:var(--bg2);
  border-radius:10px;padding:10px 16px}
input[type=search]:focus{outline:none;border-color:var(--accent);box-shadow:var(--glow)}
input::placeholder{color:var(--dim)}

/* creator code */
.creator{display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(90deg,var(--accent) 0%,#00ffcc 100%);color:#0a0c12;
  border:none;width:100%;padding:10px 16px;border-radius:10px;margin-bottom:12px;
  font-weight:700;cursor:pointer;transition:all .2s}
.creator:hover{box-shadow:0 0 30px rgba(0,212,255,.4);transform:translateY(-1px)}
.creator .tag{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  background:rgba(10,12,18,.2);padding:3px 8px;border-radius:6px}
.creator .code{font:800 18px/1 'Fortnite','Inter',sans-serif;letter-spacing:2px}
.creator .note{opacity:.7;font-size:12px}
@media(max-width:500px){.creator .note{display:none}}

/* filters */
.search-row{display:flex;gap:10px;margin-bottom:10px}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.filters::-webkit-scrollbar{display:none}
.chip{border-radius:20px;padding:7px 14px;font-size:12px;font-weight:600;white-space:nowrap;
  background:var(--panel);border:1px solid var(--line);color:var(--dim);transition:all .15s}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.on{background:var(--accent);color:#0a0c12;border-color:transparent;font-weight:700}

main{padding:16px;max-width:1400px;margin:0 auto}

/* hero stats */
.hero{background:linear-gradient(135deg,var(--panel) 0%,var(--panel2) 100%);
  border:1px solid var(--line);border-radius:16px;padding:20px 24px;margin-bottom:20px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
@media(max-width:500px){.hero-top{flex-direction:column;text-align:center}}
.hero-main h2{font:800 42px/1 'Fortnite','Inter',sans-serif;letter-spacing:1px;
  background:linear-gradient(135deg,var(--text),var(--dim));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-main span{color:var(--dim);font-size:14px;font-weight:500}
.hero-stats{display:flex;gap:24px}
.stat{text-align:center}
.stat-val{font:700 28px/1 'Fortnite','Inter',sans-serif;color:var(--accent)}
.stat-val.gold{color:var(--mythic)}
.stat-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.progress-bar{height:6px;background:var(--bg);border-radius:10px;overflow:hidden;margin-top:16px}
.progress-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#00ffcc);border-radius:10px}
.breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:16px}
.bd{background:var(--bg);border-radius:10px;padding:10px 12px}
.bd-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bd-top span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
.bd-top b{font-size:13px;font-weight:700;color:var(--text)}
.bd-bar{height:4px;background:var(--panel);border-radius:10px;overflow:hidden}
.bd-bar i{display:block;height:100%;border-radius:10px;background:var(--c)}

/* grid */
.group-title{display:flex;align-items:center;gap:12px;margin:24px 0 14px;
  font:700 14px/1 'Fortnite','Inter',sans-serif;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--dim)}
.group-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
@media(min-width:768px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}

/* cards */
.card{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:var(--panel);cursor:pointer;transition:all .2s}
.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:var(--glow)}
.card.mastered{border-color:var(--mythic);box-shadow:0 0 20px rgba(250,204,21,.2)}
.card:not(.owned){filter:grayscale(1);opacity:.4}
.card:not(.owned):hover{filter:grayscale(.8);opacity:.6}
.art-wrap{position:relative;aspect-ratio:1;display:grid;place-items:center;padding:20px;
  background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.3) 100%)}
.art-wrap::before{content:"";position:absolute;inset:0;background:var(--vc);opacity:.15}
.art{position:relative;z-index:1;width:80%;height:80%;object-fit:contain;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,.6))}
.art-fallback{position:relative;z-index:1;width:60%;aspect-ratio:1;border-radius:12px;
  display:grid;place-items:center;font:800 32px/1 'Fortnite','Inter',sans-serif;
  color:rgba(10,12,18,.8);background:var(--vc)}
.card-info{padding:10px 12px 12px}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  padding:3px 7px;border-radius:5px;background:var(--r);color:#0a0c12}
.status{font-size:10px;font-weight:700;letter-spacing:.3px}
.status.mastered{color:var(--mythic)}
.status.missing{color:var(--dim)}
.status.owned{color:var(--accent)}
.card-name{font:600 13px/1.2 'Inter',sans-serif;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--dim);text-align:center;padding:60px 20px;font-size:15px}

@keyframes spin{to{transform:rotate(360deg)}}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  padding:12px 20px;border-radius:12px;font-size:13px;font-weight:500;z-index:100;
  box-shadow:0 10px 40px rgba(0,0,0,.5);opacity:0;transition:all .2s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{border-color:var(--legendary);color:var(--legendary)}

/* dialogs */
dialog{border:1px solid var(--line);background:var(--panel);color:var(--text);
  border-radius:16px;padding:0;width:min(92vw,420px);box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
.dlg-body{padding:20px}
.dlg-body h2{font:700 18px/1.3 'Fortnite','Inter',sans-serif;margin-bottom:6px}
.dlg-body p{color:var(--dim);font-size:13px;margin-bottom:16px}
.dlg-body label{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;
  letter-spacing:.5px;margin:12px 0 6px}
.dlg-body select{width:100%}
.dlg-actions{display:flex;gap:10px;margin-top:20px}
.dlg-actions button{flex:1}

/* info panel */
#infoDlg{width:min(94vw,440px)}
.info-head{position:relative;overflow:hidden;text-align:center;
  padding:28px 20px 20px;border-bottom:1px solid var(--line)}
.info-head::before{content:"";position:absolute;inset:0;background:var(--vc);opacity:.12}
.info-head::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at top,transparent 0%,var(--panel) 70%)}
.info-art{position:relative;z-index:1;width:120px;height:120px;margin:0 auto 14px;
  object-fit:contain;filter:drop-shadow(0 12px 30px rgba(0,0,0,.6));
  display:grid;place-items:center;font:800 48px/1 'Fortnite','Inter',sans-serif;color:rgba(10,12,18,.8)}
.info-head h2{position:relative;z-index:1;font:700 22px/1.2 'Fortnite','Inter',sans-serif}
.info-sub{position:relative;z-index:1;color:var(--dim);font-size:13px;margin-top:5px}
.pill{position:relative;z-index:1;display:inline-block;font-size:10px;font-weight:700;
  letter-spacing:.6px;text-transform:uppercase;padding:5px 14px;border-radius:20px;
  margin-top:12px;background:var(--r);color:#0a0c12}
.pill.miss{background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.info-body{padding:6px 20px 20px;max-height:min(50vh,400px);overflow-y:auto}
.info-sec{margin-top:16px}
.info-sec h3{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:6px}
.info-sec p{font-size:14px;color:var(--text);line-height:1.5}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.fact{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fact b{display:block;font:600 15px/1 'Inter',sans-serif}
.fact span{font-size:11px;color:var(--dim);margin-top:2px;display:block}
.info-foot{padding:0 20px 20px}
.info-foot button{width:100%}

/* epic login */
.btn-epic{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border:none;font-weight:700}
.btn-epic:hover{box-shadow:0 0 24px rgba(168,85,247,.5)}
.btn-epic.linked{background:var(--panel2);border:1px solid var(--accent);color:var(--accent)}
.epic-code{font:800 32px/1 'Fortnite','Inter',sans-serif;letter-spacing:8px;color:var(--accent);
  background:var(--bg);padding:16px 24px;border-radius:12px;margin:16px 0;text-align:center}
.epic-waiting{color:var(--dim);font-size:13px;text-align:center}
.epic-waiting::after{content:'';animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

/* profile */
#profileArea{display:flex;align-items:center;gap:8px}
.profile-btn{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:6px 14px 6px 6px;cursor:pointer;transition:all .15s}
.profile-btn:hover{border-color:var(--accent);box-shadow:var(--glow)}
.profile-avatar{width:32px;height:32px;border-radius:8px;background:var(--bg)}
.profile-name{font-size:13px;font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.login-prompt{font-size:12px;color:var(--dim)}
</style>
</head>
<body>

<header>
  <button class="creator" id="creatorBar" title="Copy creator code">
    <span class="tag">Creator Code</span>
    <span class="code">RDOTA</span>
    <span class="note">#EpicPartner</span>
  </button>
  <div class="header-top">
    <span class="logo">Spritedex</span>
    <div class="header-actions">
      <button id="exportBtn" class="btn-primary">Export</button>
      <div id="profileArea"></div>
    </div>
  </div>
  <div class="search-row">
    <input type="search" id="search" placeholder="Search sprites..." autocomplete="off">
  </div>
  <div class="filters" id="fStatus"></div>
  <div class="filters" id="fRarity"></div>
</header>

<main><div id="content"></div></main>

<dialog id="exportDlg"><div class="dlg-body">
  <h2>Export image</h2>
  <p>Saves a PNG of your index.</p>
  <label for="exView">Show</label>
  <select id="exView">
    <option value="all">All sprites — uncollected greyed out</option>
    <option value="owned">Collected only</option>
    <option value="missing">Missing only</option>
    <option value="mastered">Mastered only</option>
    <option value="unmastered">Collected but NOT mastered</option>
  </select>
  <label for="exGroup">Group by</label>
  <select id="exGroup">
    <option value="rarity">Rarity</option>
    <option value="sprite">Sprite</option>
    <option value="none">Nothing — one grid</option>
  </select>
  <div class="dlg-actions">
    <button id="exCancel">Cancel</button>
    <button id="exGo" class="btn-primary">Save PNG</button>
  </div>
</div></dialog>

<dialog id="infoDlg">
  <div class="info-head" id="infoHead"></div>
  <div class="info-body" id="infoBody"></div>
  <div class="info-foot"><button id="infoClose" class="btn-primary">Close</button></div>
</dialog>

<dialog id="epicDlg"><div class="dlg-body">
  <h2 id="epicTitle">Link Your Epic Account</h2>
  <p id="epicDesc">Automatically sync your Fortnite locker to see which sprites you own.</p>
  <div id="epicContent"></div>
  <div class="dlg-actions">
    <button id="epicClose">Cancel</button>
  </div>
</div></dialog>


<script>
const KEY='spriteIndex.v1', CATKEY='spriteIndex.catalog.v1';
let DB=null, state=load(), catalog=loadCat(), filters={status:'all',rarity:'all',q:''};

function load(){ try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}} }
function save(){ localStorage.setItem(KEY,JSON.stringify(state)) }
function loadCat(){ try{return JSON.parse(localStorage.getItem(CATKEY))||null}catch{return null} }
const uid=(s,v)=>s+':'+v;
const st=k=>state[k]||{owned:false,mastered:false};

const norm=s=>(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const findSprite=name=>DB.sprites.find(s=>norm(s.name)===norm(name))
  || DB.sprites.find(s=>norm(s.id)===norm(name));
const findVariant=name=>DB.variants.find(v=>norm(v.name)===norm(name))
  || (norm(name)==='base' ? DB.variants.find(v=>v.id==='normal') : null);

// Entries come from an imported SpriteTrading catalog when we have one —
// that's authoritative for which variants actually exist per sprite.
// Otherwise fall back to the shipped (partly inferred) database.
let ENTRIES=[];
function buildEntries(){
  ENTRIES=[];
  if(catalog && catalog.entries && catalog.entries.length){
    for(const e of catalog.entries){
      const s=findSprite(e.sprite);
      const v=findVariant(e.variant);
      const vid=v?v.id:norm(e.variant);
      ENTRIES.push({
        key:uid(s?s.id:norm(e.sprite),vid),
        sprite:s||{id:norm(e.sprite),name:e.sprite,
          rarity:(e.rarity||'rare').toLowerCase(),ability:'',howToGet:''},
        variantId:vid,
        variant:v||{id:vid,name:e.variant,effect:''},
        img:e.img||null,
        raw:e            // dust cost, dex number, acquired date - for the info panel
      });
    }
    // Keep the shipped rarity where we have it; "Special" isn't a real tier.
    for(const e of ENTRIES)
      if(!DB.rarities.some(r=>r.id===e.sprite.rarity)) e.sprite.rarity='rare';
  } else {
    for(const s of DB.sprites)
      for(const v of s.variants)
        ENTRIES.push({key:uid(s.id,v),sprite:s,variantId:v,
          variant:DB.variants.find(x=>x.id===v),img:null});
  }
}

// Import spritetrading account export format (collection.sprites object)
function importFromSpritetrading(d){
  const sprites = d?.collection?.sprites;
  if(!sprites) return;

  // Map spritetrading internal names to our DB ids (they match now)
  for(const [key, data] of Object.entries(sprites)){
    // Parse key: "gold-water" -> variant=gold, sprite=water
    // Or just "water" -> variant=normal, sprite=water
    const VARIANTS = ['gold','gummy','galaxy','gem','holofoil','cube','quack'];
    let variant = 'normal';
    let spriteId = key;

    for(const v of VARIANTS){
      if(key.startsWith(v + '-')){
        variant = v;
        spriteId = key.slice(v.length + 1);
        break;
      }
    }

    const dbKey = spriteId + ':' + variant;

    // Check if this entry exists in our DB
    const entry = ENTRIES.find(e => e.key === dbKey);
    if(entry){
      state[dbKey] = {
        owned: true,
        mastered: data.mastered || false,
        level: data.level || null
      };
    }
  }
  save();
}

// Apply a spritetrading-export.json file.
function importExport(d){
  if(!d || !Array.isArray(d.entries)) throw new Error('not a SpriteTrading export');
  catalog={entries:d.entries};
  localStorage.setItem(CATKEY,JSON.stringify(catalog));
  buildEntries();
  const byKey=new Map(ENTRIES.map(e=>[e.key,e]));
  let n=0;
  for(const e of d.entries){
    const s=findSprite(e.sprite), v=findVariant(e.variant);
    const k=uid(s?s.id:norm(e.sprite), v?v.id:norm(e.variant));
    if(!byKey.has(k)) continue;
    state[k]={owned:!!e.collected, mastered:!!e.mastered, level:e.level||null};
    n++;
  }
  save(); render();
  return {applied:n, total:d.entries.length};
}

function visible(){
  const q=filters.q.trim().toLowerCase();
  return ENTRIES.filter(e=>{
    const s=st(e.key);
    if(filters.rarity!=='all' && e.sprite.rarity!==filters.rarity) return false;
    if(filters.status==='owned' && !s.owned) return false;
    if(filters.status==='missing' && s.owned) return false;
    if(filters.status==='mastered' && !s.mastered) return false;
    if(filters.status==='unmastered' && !(s.owned && !s.mastered)) return false;
    if(q && !(e.sprite.name+' '+e.variant.name).toLowerCase().includes(q)) return false;
    return true;
  });
}

// Per-variant colours (kept inside our palette), used for the breakdown bars
// and to tint each card the way spritetrading tints its cards.
const VCOL={normal:'#8b94ad',base:'#8b94ad',gold:'#F5C542',gummy:'#4dd4ff',
  galaxy:'#A64BF4',gem:'#3ddc97',holofoil:'#ff6ec7',cube:'#F0862E',quack:'#7bd88f'};
const vcol=id=>VCOL[(id||'').toLowerCase()]||'#8b94ad';
const VORDER=[['normal','Base'],['gold','Gold'],['gummy','Gummy'],['galaxy','Galaxy'],
  ['gem','Gem'],['holofoil','Holofoil'],['cube','Cube'],['quack','Quack']];
let syncedAt=null;

function fmtSync(when){
  if(!when) return '';
  const d=new Date(when);
  return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
}

function renderHero(){
  const owned=ENTRIES.filter(e=>st(e.key).owned).length;
  const mast=ENTRIES.filter(e=>st(e.key).mastered).length;
  const t=ENTRIES.length||1;
  const pct=Math.round(owned/t*100);

  const m={};
  for(const e of ENTRIES){
    const id=(e.variantId||'').toLowerCase();
    (m[id]=m[id]||{o:0,t:0}); m[id].t++; if(st(e.key).owned) m[id].o++;
  }
  const bd=VORDER.filter(([id])=>m[id]&&m[id].t).map(([id,label])=>{
    const c=m[id]; return `<div class="bd">
      <div class="bd-top"><span>${label}</span><b>${c.o}/${c.t}</b></div>
      <div class="bd-bar"><i style="--c:${vcol(id)};width:${Math.round(c.o/c.t*100)}%"></i></div>
    </div>`;
  }).join('');

  return `<section class="hero">
    <div class="hero-top">
      <div class="hero-main">
        <h2>${owned}/${t}</h2>
        <span>Sprites Collected</span>
      </div>
      <div class="hero-stats">
        <div class="stat">
          <div class="stat-val gold">${mast}</div>
          <div class="stat-label">Mastered</div>
        </div>
        <div class="stat">
          <div class="stat-val">${pct}%</div>
          <div class="stat-label">Complete</div>
        </div>
      </div>
    </div>
    <div class="progress-bar"><i style="width:${pct}%"></i></div>
    <div class="breakdown">${bd}</div>
  </section>`;
}

function renderFilters(){

function cardHTML(e){
  const s=st(e.key), col=DB.rarities.find(r=>r.id===e.sprite.rarity).color;
  const vc=vcol(e.variantId);
  const name=e.variant.name==='Normal'?e.sprite.name:`${e.variant.name} ${e.sprite.name}`;
  const statusClass=s.mastered?'mastered':s.owned?'owned':'missing';
  const statusText=s.mastered?'★ MASTERED':s.owned?'OWNED':'MISSING';
  return `<div class="card ${s.owned?'owned':''} ${s.mastered?'mastered':''}"
    style="--r:${col};--vc:${vc}" data-k="${e.key}">
    <div class="art-wrap">
      ${e.img
        ? `<img class="art" src="${e.img}" alt="" loading="lazy" decoding="async">`
        : `<div class="art-fallback">${e.sprite.name[0]}</div>`}
    </div>
    <div class="card-info">
      <div class="card-top">
        <span class="status ${statusClass}">${statusText}</span>
        <span class="tag" style="background:${col}">${e.sprite.rarity}</span>
      </div>
      <div class="card-name">${name}</div>
    </div>
  </div>`;
}

function render(){
  renderFilters();
  const list=visible();
  let html=renderHero();
  if(!list.length){
    content.innerHTML=html+'<p class="empty">Nothing matches those filters.</p>'; return;
  }
  for(const r of DB.rarities){
    const g=list.filter(e=>e.sprite.rarity===r.id);
    if(!g.length) continue;
    const own=g.filter(e=>st(e.key).owned).length;
    html+=`<div class="group-title" style="color:${r.color}">${r.name} · ${own}/${g.length}</div>
      <div class="grid">${g.map(cardHTML).join('')}</div>`;
  }
  content.innerHTML=html;
}

function exportSet(view){
  return ENTRIES.filter(e=>{
    const s=st(e.key);
    if(view==='owned') return s.owned;
    if(view==='missing') return !s.owned;
    if(view==='mastered') return s.mastered;
    if(view==='unmastered') return s.owned && !s.mastered;
    return true;
  });
}

// Load with crossOrigin so the canvas stays exportable. If the host sends no
// CORS headers the load fails (rather than tainting the canvas) and we fall
// back to a coloured letter tile — export must never break.
function loadArt(url){
  return new Promise(res=>{
    if(!url) return res(null);
    const i=new Image();
    i.crossOrigin='anonymous';
    i.onload=()=>res(i);
    i.onerror=()=>res(null);
    i.src=url;
    setTimeout(()=>res(null),6000);
  });
}

async function drawPNG(view,groupBy){
  const list=exportSet(view);
  if(!list.length){ alert('Nothing to export for that selection.'); return }

  const art=new Map();
  await Promise.all([...new Set(list.map(e=>e.img).filter(Boolean))]
    .map(async u=>art.set(u,await loadArt(u))));

  const S=2, CW=124, CH=140, GAP=12, PAD=32, COLS=Math.min(8,Math.max(4,Math.ceil(Math.sqrt(list.length))));
  // group
  let groups=[];
  if(groupBy==='rarity')
    groups=DB.rarities.map(r=>({t:r.name,c:r.color,items:list.filter(e=>e.sprite.rarity===r.id)})).filter(g=>g.items.length);
  else if(groupBy==='sprite')
    groups=DB.sprites.map(s=>({t:s.name,c:DB.rarities.find(r=>r.id===s.rarity).color,
      items:list.filter(e=>e.sprite.id===s.id)})).filter(g=>g.items.length);
  else groups=[{t:null,items:list}];

  const HEAD=150, HDR=46;
  let h=HEAD;
  for(const g of groups){
    g.rows=Math.ceil(g.items.length/COLS);
    h+=(g.t?HDR:0)+g.rows*(CH+GAP);
  }
  h+=PAD+34;
  const w=PAD*2+COLS*CW+(COLS-1)*GAP;

  const cv=document.createElement('canvas');
  cv.width=w*S; cv.height=h*S;
  const x=cv.getContext('2d'); x.scale(S,S);
  x.fillStyle='#0d0f16'; x.fillRect(0,0,w,h);

  const owned=ENTRIES.filter(e=>st(e.key).owned).length;
  const mast=ENTRIES.filter(e=>st(e.key).mastered).length;
  const T=ENTRIES.length;
  const label={all:'All Sprites',owned:'Collected',missing:'Missing',
    mastered:'Mastered',unmastered:'Collected · Not Mastered'}[view];

  x.fillStyle='#e8ecf6'; x.font='700 30px system-ui,sans-serif';
  x.fillText('Sprite Index — '+label,PAD,PAD+30);
  x.fillStyle='#8b94ad'; x.font='400 16px system-ui,sans-serif';
  x.fillText(`${owned}/${T} collected · ${mast} mastered · ${T-owned} missing · ${list.length} shown`,PAD,PAD+58);
  x.fillText(new Date().toLocaleDateString(),PAD,PAD+82);
  x.fillStyle='#2a3145'; x.fillRect(PAD,PAD+100,w-PAD*2,1);

  const rr=(a,b,c,d,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+c,b,a+c,b+d,r);
    x.arcTo(a+c,b+d,a,b+d,r);x.arcTo(a,b+d,a,b,r);x.arcTo(a,b,a+c,b,r);x.closePath()};

  let y=HEAD;
  for(const g of groups){
    if(g.t){
      x.fillStyle=g.c||'#8b94ad'; x.font='700 15px system-ui,sans-serif';
      const on=g.items.filter(e=>st(e.key).owned).length;
      x.fillText(g.t.toUpperCase()+'  ·  '+on+'/'+g.items.length,PAD,y+26);
      y+=HDR;
    }
    g.items.forEach((e,i)=>{
      const cx=PAD+(i%COLS)*(CW+GAP), cy=y+Math.floor(i/COLS)*(CH+GAP);
      const s=st(e.key), col=DB.rarities.find(r=>r.id===e.sprite.rarity).color;
      const dim=!s.owned;

      x.globalAlpha=dim?.3:1;
      x.fillStyle=dim?'#161a26':'#1e2333'; rr(cx,cy,CW,CH,14); x.fill();
      x.strokeStyle=s.mastered?'#F5C542':(dim?'#2a3145':col);
      x.lineWidth=s.mastered?2.5:1.5; rr(cx,cy,CW,CH,14); x.stroke();

      const im=e.img?art.get(e.img):null;
      x.textAlign='center';
      if(im){
        x.drawImage(im,cx+CW/2-27,cy+18,54,54);
      } else {
        x.fillStyle=col; rr(cx+CW/2-27,cy+18,54,54,13); x.fill();
        x.fillStyle='#0c0e14'; x.font='800 24px system-ui,sans-serif';
        x.fillText(e.sprite.name[0],cx+CW/2,cy+53);
      }

      x.fillStyle='#e8ecf6'; x.font='650 14px system-ui,sans-serif';
      let nm=e.sprite.name;
      while(x.measureText(nm).width>CW-16 && nm.length>3) nm=nm.slice(0,-1);
      if(nm!==e.sprite.name) nm=nm.slice(0,-1)+'…';
      x.fillText(nm,cx+CW/2,cy+94);
      x.fillStyle='#8b94ad'; x.font='400 12px system-ui,sans-serif';
      x.fillText(e.variant.name,cx+CW/2,cy+112);

      if(s.mastered){
        x.fillStyle='#F5C542'; x.font='700 11px system-ui,sans-serif';
        x.fillText('★ MASTERED',cx+CW/2,cy+130);
      } else if(!s.owned){
        x.fillStyle='#6b748a';
        x.font='700 11px system-ui,sans-serif';
        x.fillText('MISSING',cx+CW/2,cy+130);
      }
      x.textAlign='left'; x.globalAlpha=1;
    });
    y+=g.rows*(CH+GAP);
  }

  x.fillStyle='#4a5268'; x.font='400 12px system-ui,sans-serif';
  x.fillText('Sprite Index',PAD,h-PAD+12);

  try{
    cv.toBlob(b=>{
      if(!b){ alert('Export failed while encoding the image.'); return }
      const u=URL.createObjectURL(b), a=document.createElement('a');
      a.href=u; a.download=`sprite-index-${view}-${new Date().toISOString().slice(0,10)}.png`;
      a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000);
    },'image/png');
  }catch(err){
    alert('Export failed: '+err.message);
  }
}

async function pullCollection(){
  try{

    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();

      importExport(d);
      if(stamp) localStorage.setItem(SYNCKEY,stamp);

    showSynced(stamp);
  }catch(err){
    // Offline or the file didn't load: keep whatever we already had.
  }
}

const API_BASE = 'https://spritedex-api.abrasive-tax.workers.dev';
const EPIC_AUTH_URL = 'https://www.epicgames.com/id/api/redirect?clientId=ec684b8c687f479fadea3cb2ad83f5c6&responseType=code';

const epicAuth = {
  accountId: localStorage.getItem('epic_account_id'),
  displayName: localStorage.getItem('epic_display_name'),
  isLoggedIn(){ return !!this.accountId },

  async exchangeCode(code){
    const r = await fetch(`${API_BASE}/auth/exchange`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ code })
    });
    const d = await r.json();
    if(d.error) throw new Error(d.error);

    this.accountId = d.account_id;
    this.displayName = d.display_name;
    localStorage.setItem('epic_account_id', d.account_id);
    localStorage.setItem('epic_display_name', d.display_name);
    return d;
  },

  async getLocker(token){
    if(!this.accountId) throw new Error('Not logged in');
    let url = `${API_BASE}/locker?account_id=${this.accountId}`;
    if(token) url += `&token=${encodeURIComponent(token)}`;
    const r = await fetch(url);
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    return d;
  },

  logout(){
    this.accountId = null;
    this.displayName = null;
    localStorage.removeItem('epic_account_id');
    localStorage.removeItem('epic_display_name');
  }
};

async function syncFromEpic(token){
  const locker = await epicAuth.getLocker(token);

  // Find spritemastery tokens
  const masteryTokens = locker.cosmetics.filter(c =>
    (c.templateId || '').includes('spritemastery_token')
  );

  // Map Epic sprite tokens to sprite entries
  // Token format: "Token:athena_s41_spritemastery_token_qXX" or "Token:athena_s41_spritemastery_token_qXXy"
  // where XX = sprite number (01-25), y = variant letter (a-g)

  // Sprite mapping: q number -> sprite id (spritetrading internal names)
  const SPRITE_MAP = {
    '01': 'water', '02': 'earth', '03': 'fire', '04': 'fishy', '05': 'air',
    '06': 'duck', '07': 'ghost', '08': 'demon', '09': 'king', '10': 'aura',
    '11': 'striker', '12': 'dream', '13': 'punk', '14': 'boss', '15': 'seven',
    '16': 'llama', '17': 'peely', '18': 'grim', '19': 'zeropoint', '20': 'burntpeanut',
    '21': 'fossilmeal', '22': 'cokeparmesan', '23': 'companystargazer', '24': 'fillergrunt', '25': 'pedicureantacid'
  };

  // Variant letter -> variant name (GLOBAL mapping, same for all sprites)
  const VARIANT_MAP = {
    '': 'normal',
    'a': 'gold',
    'b': 'gummy',
    'c': 'galaxy',
    'd': 'holofoil',
    'e': 'gem',
    'f': 'cube',
    'g': 'quack'
  };

  const matched = [];
  const unmatched = [];

  for(const item of locker.cosmetics){
    const templateId = item.templateId || '';

    // Check if it's a sprite token
    if(templateId.startsWith('Token:athena_s41_spritemastery_token_q')){
      const tokenId = templateId.replace('Token:athena_s41_spritemastery_token_q', '');
      // Parse: "07a" -> sprite 07, variant a
      const match = tokenId.match(/^(\d+)([a-g]?)$/);
      if(match){
        const spriteNum = match[1].padStart(2, '0');
        const variantLetter = match[2] || '';
        const variantId = VARIANT_MAP[variantLetter];

        const spriteId = SPRITE_MAP[spriteNum];

        if(spriteId && variantId){
          const key = spriteId + ':' + variantId;

          // Always set state for valid tokens (even if no ENTRY yet - DB might be outdated)
          // Having a spritemastery_token = sprite is MASTERED (you only get the token by extracting at level 5)
          const existing = state[key] || {};
          state[key] = {
            owned: true,
            mastered: true,  // Token existence = mastered!
            level: item.attributes?.level || existing.level || null
          };

          // Track whether it matched an ENTRY or not
          const entry = ENTRIES.find(e => e.key === key);
          if(entry){
            matched.push({ templateId, key, spriteId, variantId });
          } else {
            unmatched.push({ templateId, key, spriteId, variantId, reason: 'no DB entry (DB needs update)' });
          }
        } else {
          unmatched.push({ templateId, tokenId, spriteNum, variantLetter, reason: spriteId ? 'unknown variant letter' : 'unknown sprite number' });
        }
      } else {
        unmatched.push({ templateId, tokenId, reason: 'regex no match' });
      }
    }
  }

  save();
  render();
}

    content.innerHTML='<p class="empty">Could not load sprite data.</p>'; return;
  }
  buildEntries();
  render();

  // If not logged in, clear state to show all as not collected
  if(!epicAuth.isLoggedIn()){
    state = {};
    save();
  }

  updateProfileArea();

  // If linked to Epic, sync from there
  if(epicAuth.isLoggedIn()){
    try{ await syncFromEpic(); }
    catch(e){ render(); }
  }
}
boot();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
