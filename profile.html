<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0c12">
<meta name="description" content="Spritedex - View Fortnite Sprite collection">
<title>Profile - Spritedex</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c12; --bg2:#0f1118; --panel:#151820; --panel2:#1a1e28;
  --line:#252a38; --text:#f0f2f8; --dim:#6b7280; --accent:#00d4ff;
  --rare:#3AA7F0; --epic:#A855F7; --legendary:#F97316; --mythic:#FACC15;
  --glow:0 0 20px rgba(0,212,255,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 'Inter',system-ui,sans-serif;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:20px}

header{background:linear-gradient(180deg,rgba(10,12,18,.98),rgba(10,12,18,.95));
  border-bottom:1px solid var(--line);padding:16px 20px;position:sticky;top:0;z-index:50}
.header-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.logo{font:800 24px/1 'Inter',sans-serif;letter-spacing:1px;text-transform:uppercase;
  background:linear-gradient(135deg,var(--accent),#00ffcc);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;text-decoration:none}
.back-btn{color:var(--dim);text-decoration:none;font-size:13px;display:flex;align-items:center;gap:6px}
.back-btn:hover{color:var(--text)}

.search-section{margin-bottom:24px}
.search-box{display:flex;gap:10px}
.search-box input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px 16px;color:var(--text);font-size:15px}
.search-box input:focus{outline:none;border-color:var(--accent);box-shadow:var(--glow)}
.search-box input::placeholder{color:var(--dim)}
.search-box button{background:linear-gradient(135deg,var(--accent),#00ccff);color:#0a0c12;
  border:none;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer}
.search-results{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.search-result{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;
  display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .15s}
.search-result:hover{border-color:var(--accent)}
.search-result .name{font-weight:600}
.search-result .badge{font-size:11px;color:var(--dim);background:var(--panel2);padding:4px 10px;border-radius:6px}
.no-results{color:var(--dim);text-align:center;padding:40px 20px}

.profile-card{background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:16px;padding:24px;text-align:center;margin-bottom:20px}
.profile-avatar{width:72px;height:72px;border-radius:50%;background:var(--bg);margin:0 auto 12px;
  display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--accent);
  border:3px solid var(--accent)}
.profile-name{font:700 24px/1.2 'Luckiest Guy','Inter',sans-serif;margin-bottom:4px}
.profile-joined{color:var(--dim);font-size:12px;margin-bottom:16px}
.profile-stats{display:flex;justify-content:center;gap:28px}
.profile-stat{text-align:center}
.profile-stat-val{font:700 28px/1 'Luckiest Guy','Inter',sans-serif;color:var(--accent)}
.profile-stat-val.gold{color:var(--mythic)}
.profile-stat-label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}

/* Season Tabs */
.season-tabs{display:flex;gap:6px;margin-bottom:16px}
.season-tab{flex:1;padding:12px 16px;border-radius:10px;font-weight:600;font-size:13px;
  background:var(--panel);border:1px solid var(--line);color:var(--dim);cursor:pointer;text-align:center}
.season-tab:hover{border-color:var(--accent);color:var(--text)}
.season-tab.active{background:linear-gradient(135deg,var(--accent),#00ccff);color:#0a0c12;border:none}
.season-tab .pct{font-size:11px;opacity:.7;margin-left:6px}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:center}
.card.owned{border-color:var(--accent)}
.card.mastered{border-color:var(--mythic);box-shadow:0 0 12px rgba(250,204,21,.15)}
.card.missing{opacity:.35;filter:grayscale(1)}
.card-art{aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:12px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.2))}
.card-art img{width:70%;height:70%;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.card-fallback{width:50px;height:50px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font:700 20px 'Luckiest Guy',sans-serif;color:rgba(0,0,0,.6);background:var(--accent)}
.card-info{padding:8px 10px 10px}
.card-name{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-status{font-size:9px;color:var(--dim);text-transform:uppercase;margin-top:2px}
.card.mastered .card-status{color:var(--mythic)}
.card.owned .card-status{color:var(--accent)}

.loading{text-align:center;padding:60px 20px;color:var(--dim)}
.loading-spinner{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

.error-card{background:var(--panel);border:1px solid var(--legendary);border-radius:16px;padding:40px;text-align:center}
.error-card h2{color:var(--legendary);font-size:18px;margin-bottom:8px}
.error-card p{color:var(--dim);font-size:14px}
.private-msg{color:var(--dim);padding:40px 20px;text-align:center}
.private-msg svg{width:48px;height:48px;color:var(--line);margin-bottom:12px;display:block;margin:0 auto 12px}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="/" class="logo">Spritedex</a>
    <a href="/" class="back-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Back</a>
  </div>
</header>

<div class="container">
  <div class="search-section">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search Epic username..." autocomplete="off">
      <button id="searchBtn">Search</button>
    </div>
    <div id="searchResults" class="search-results"></div>
  </div>
  <div id="profileContent"></div>
</div>

<script>
const API_BASE = 'https://spritedex-api.abrasive-tax.workers.dev';
let DB = null;
let currentProfile = null;
let currentSeason = 's4';

// Load sprite database for images
async function loadDB() {
  if (DB) return;
  try {
    DB = await (await fetch('/data/sprites.json?t=' + Date.now())).json();
  } catch(e) { console.error('Failed to load sprites DB'); }
}

// Get sprite image URL from DB
function getSpriteImg(spriteId, variantId) {
  if (!DB) return null;
  const sprite = DB.sprites.find(s => s.id === spriteId);
  if (!sprite) return null;
  if (sprite.variant_imgs && sprite.variant_imgs[variantId]) return sprite.variant_imgs[variantId];
  return sprite.img || null;
}

// Get sprite display name
function getSpriteName(spriteId) {
  if (!DB) return spriteId;
  const sprite = DB.sprites.find(s => s.id === spriteId);
  return sprite ? sprite.name : spriteId;
}

const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchResults = document.getElementById('searchResults');
const profileContent = document.getElementById('profileContent');

// Check URL for username
const urlParams = new URLSearchParams(window.location.search);
const queryUser = urlParams.get('u');
if (queryUser) {
  searchInput.value = decodeURIComponent(queryUser);
  loadProfile(decodeURIComponent(queryUser));
}

searchBtn.onclick = () => doSearch();
searchInput.onkeydown = (e) => { if(e.key === 'Enter') doSearch(); };

async function doSearch() {
  const query = searchInput.value.trim();
  if (query.length < 2) return;

  searchResults.innerHTML = '<div class="loading"><div class="loading-spinner"></div></div>';

  try {
    const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}`);
    const data = await res.json();

    if (!data.results || data.results.length === 0) {
      searchResults.innerHTML = '<div class="no-results">No users found</div>';
      return;
    }

    searchResults.innerHTML = data.results.map(u => `
      <div class="search-result" onclick="loadProfile('${u.display_name.replace(/'/g, "\\'")}')">
        <span class="name">${u.display_name}</span>
        <span class="badge">${u.private ? 'Private' : 'View'}</span>
      </div>
    `).join('');
  } catch (e) {
    searchResults.innerHTML = '<div class="no-results">Search failed</div>';
  }
}

async function loadProfile(username) {
  await loadDB();
  history.replaceState({}, '', `/profile.html?u=${encodeURIComponent(username)}`);
  document.title = `${username} - Spritedex`;
  searchResults.innerHTML = '';

  profileContent.innerHTML = '<div class="loading"><div class="loading-spinner"></div>Loading...</div>';

  try {
    const res = await fetch(`${API_BASE}/profile/${encodeURIComponent(username)}`);
    const data = await res.json();

    if (!data.found) {
      profileContent.innerHTML = `<div class="error-card"><h2>User Not Found</h2><p>"${username}" is not registered on Spritedex</p></div>`;
      return;
    }

    if (data.private) {
      profileContent.innerHTML = `
        <div class="profile-card">
          <div class="profile-avatar">${data.display_name[0].toUpperCase()}</div>
          <div class="profile-name">${data.display_name}</div>
          <div class="private-msg">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            This profile is private
          </div>
        </div>`;
      return;
    }

    currentProfile = data;
    renderProfile();
  } catch (e) {
    profileContent.innerHTML = `<div class="error-card"><h2>Error</h2><p>Could not load profile</p></div>`;
  }
}

function renderProfile() {
  const data = currentProfile;
  const sprites = data.sprites || {};

  // Filter by season
  const seasonSprites = Object.entries(sprites).filter(([key]) => {
    const season = key.split(':')[0];
    return season === currentSeason;
  });

  const owned = seasonSprites.filter(([,s]) => s.owned).length;
  const mastered = seasonSprites.filter(([,s]) => s.mastered).length;
  const total = seasonSprites.length || 1;
  const pct = Math.round(owned / total * 100);

  // Calculate other season stats for tabs
  const s3Sprites = Object.entries(sprites).filter(([k]) => k.startsWith('s3:'));
  const s4Sprites = Object.entries(sprites).filter(([k]) => k.startsWith('s4:'));
  const s3Pct = s3Sprites.length ? Math.round(s3Sprites.filter(([,s]) => s.owned).length / s3Sprites.length * 100) : 0;
  const s4Pct = s4Sprites.length ? Math.round(s4Sprites.filter(([,s]) => s.owned).length / s4Sprites.length * 100) : 0;

  const joinDate = data.joined_at ? new Date(data.joined_at).toLocaleDateString('en-US', {month:'short',year:'numeric'}) : '';

  profileContent.innerHTML = `
    <div class="profile-card">
      <div class="profile-avatar">${data.display_name[0].toUpperCase()}</div>
      <div class="profile-name">${data.display_name}</div>
      <div class="profile-joined">${joinDate ? 'Member since ' + joinDate : ''}</div>
      <div class="profile-stats">
        <div class="profile-stat"><div class="profile-stat-val">${owned}/${total}</div><div class="profile-stat-label">Collected</div></div>
        <div class="profile-stat"><div class="profile-stat-val gold">${mastered}</div><div class="profile-stat-label">Mastered</div></div>
        <div class="profile-stat"><div class="profile-stat-val">${pct}%</div><div class="profile-stat-label">Complete</div></div>
      </div>
    </div>

    <div class="season-tabs">
      <button class="season-tab ${currentSeason === 's4' ? 'active' : ''}" onclick="switchSeason('s4')">Current Season<span class="pct">${s4Pct}%</span></button>
      <button class="season-tab ${currentSeason === 's3' ? 'active' : ''}" onclick="switchSeason('s3')">Past Sprites<span class="pct">${s3Pct}%</span></button>
    </div>

    <div class="grid" id="spriteGrid"></div>
  `;

  // Render sprite cards
  const grid = document.getElementById('spriteGrid');
  const sorted = seasonSprites.sort((a,b) => {
    if(a[1].mastered !== b[1].mastered) return b[1].mastered ? 1 : -1;
    if(a[1].owned !== b[1].owned) return b[1].owned ? 1 : -1;
    return 0;
  });

  grid.innerHTML = sorted.map(([key, s]) => {
    const [season, spriteId, variantId] = key.split(':');
    const img = getSpriteImg(spriteId, variantId || 'normal');
    const name = getSpriteName(spriteId);
    const variantLabel = variantId && variantId !== 'normal' ? variantId.charAt(0).toUpperCase() + variantId.slice(1) + ' ' : '';
    const statusClass = s.mastered ? 'mastered' : s.owned ? 'owned' : 'missing';
    const statusText = s.mastered ? 'Mastered' : s.owned ? 'Owned' : 'Missing';

    return `
      <div class="card ${statusClass}">
        <div class="card-art">
          ${img ? `<img src="${img}" alt="" loading="lazy">` : `<div class="card-fallback">${name[0]}</div>`}
        </div>
        <div class="card-info">
          <div class="card-name">${variantLabel}${name}</div>
          <div class="card-status">${statusText}</div>
        </div>
      </div>
    `;
  }).join('');
}

function switchSeason(season) {
  currentSeason = season;
  renderProfile();
}
</script>
</body>
</html>
